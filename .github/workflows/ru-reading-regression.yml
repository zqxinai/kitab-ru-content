name: Ru Classics — audit normalisasi 965 pasal
on:
  push:
    branches: [main]
    paths:
      - "ru-classics/reading-normalization.js"
      - "ru-classics/app.js"
      - "ru-classics/index.html"
      - "sishu/chapters/**"
      - "tests/ru-classics-reading*.test.js"
      - "tools/audit_ru_romanization.cjs"
      - "tools/audit_legacy_romanization.cjs"
      - ".github/workflows/ru-reading-regression.yml"
  pull_request:
    paths:
      - "ru-classics/reading-normalization.js"
      - "sishu/chapters/**"
      - "tests/ru-classics-reading*.test.js"
      - "tools/audit_ru_romanization.cjs"
      - "tools/audit_legacy_romanization.cjs"
      - ".github/workflows/ru-reading-regression.yml"
jobs:
  reading-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all four books and their names
        run: node --test tests/ru-classics-reading*.test.js
      - name: Inventory unpaired title candidates across all passages
        run: |
          node tools/audit_ru_romanization.cjs --json > ru-romanization-candidates.json
          node -e "const x=require('./ru-romanization-candidates.json'); const n=x.unresolvedTitleCandidates+x.unresolvedPlaceCandidates+x.unresolvedPersonCandidates; console.log(x.passages+' passages audited; '+n+' unpaired candidate names/places'); if(x.passages!==965||n!==0)process.exitCode=1"
      - name: Independent broad legacy orphan inventory (965 passages)
        run: |
          node tools/audit_legacy_romanization.cjs > /tmp/legacy-romanization-audit.log
          node -e "const v=require('./audit/reports/legacy-romanization-inventory.json'); console.log('Broad scan: '+v.passages+' passages; '+v.orphan_entries.length+' candidate terms; '+v.duplicate_name_pairs.length+' source duplicate aliases'); console.log('Orphan terms with examples: '+JSON.stringify(v.orphan_entries.slice(0,100).map(x=>({term:x.term,count:x.orphan,examples:x.orphanExamples.slice(0,3)})))); if(v.passages!==965||v.orphan_entries.length!==0)process.exitCode=1"
      - name: Save candidate inventory for editorial review
        uses: actions/upload-artifact@v4
        with:
          name: ru-hokkian-review-candidates
          path: |
            ru-romanization-candidates.json
            audit/reports/legacy-romanization-inventory.json
      - name: Assemble reader test bundle
        run: python tools/build_ru_classics_web.py --source dist/sishu-content.json --alignment dist/sishu-english-alignment.json --splits dist/sishu-english-passage-splits.json --output ru-classics/data/sishu.json
      - name: Reader UI smoke test
        run: node ru-classics/tests/smoke.cjs
      - name: Inventory remaining historical-name candidates
        run: node tools/audit_ru_romanization.cjs
