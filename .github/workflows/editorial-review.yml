name: Audit editorial status and Legge alignment
on:
  pull_request:
    paths:
      - 'editor/**'
      - 'dist/sishu-english-alignment.json'
      - 'dist/sishu-review-status.json'
      - 'sishu/**'
      - 'tools/audit_review_status.js'
      - 'tests/editorial-review.test.js'
      - 'tests/zhongyong-coverage.test.js'
      - 'tests/mengzi-coverage.test.js'
      - 'tests/mengzi-coverage-13-14.test.js'
      - 'tests/mengzi-coverage-04-12.test.js'
      - 'tests/mengzi-coverage-10-passages.test.js'
      - 'tests/mengzi-coverage-batch-03.test.js'
      - 'tests/mengzi-coverage-batch-04.test.js'
      - 'tests/lunyu-batch-05.test.js'
      - 'tests/lunyu-batch-06.test.js'
      - 'tests/textual-variants-b07.test.js'
      - 'tests/matakin-2012-verified-glyphs.test.js'
      - 'tests/matakin-2012-lunyu-glyphs-batch-02.test.js'
      - 'tests/daxue-matakin-2012-supplement.test.js'
      - 'tests/zhongyong-matakin-2012-interpretation.test.js'
      - 'tests/daxue-qinmin-xinmin-variant.test.js'
      - 'tests/lunyu-14-39-matakin-variant.test.js'
      - 'tests/zhongyong-ix-pinyin-variant.test.js'
      - 'editor/tests/zhongyong-ix-pinyin-smoke.mjs'
      - 'editor/tests/lunyu-14-39-variant-smoke.mjs'
      - 'editor/tests/daxue-qinmin-smoke.mjs'
      - 'editor/tests/zhongyong-comparison-smoke.mjs'
      - 'editor/tests/daxue-section-smoke.mjs'
      - 'tests/mengzi-commentary-09-07.test.js'
      - 'tests/yun-hanzi-batch-01.test.js'
      - 'tests/yun-hanzi-batch-02.test.js'
      - 'tests/yun-hanzi-batch-03.test.js'
      - 'tests/zhu-xi-audit.test.js'
      - 'tests/matakin-2012-chapters.test.js'
      - 'docs/audits/**'
      - 'tools/import_legge_zhongyong.js'
      - 'sources/legge/**'
      - 'tools/dictionaries/**'
      - '.github/workflows/editorial-review.yml'
  push:
    branches: [main]
    paths:
      - 'editor/**'
      - 'dist/sishu-english-alignment.json'
      - 'dist/sishu-review-status.json'
      - 'sishu/**'
      - 'tools/audit_review_status.js'
      - 'tests/editorial-review.test.js'
      - 'tests/zhongyong-coverage.test.js'
      - 'tests/mengzi-coverage.test.js'
      - 'tests/mengzi-coverage-13-14.test.js'
      - 'tests/mengzi-coverage-04-12.test.js'
      - 'tests/mengzi-coverage-10-passages.test.js'
      - 'tests/mengzi-coverage-batch-03.test.js'
      - 'tests/mengzi-coverage-batch-04.test.js'
      - 'tests/lunyu-batch-05.test.js'
      - 'tests/lunyu-batch-06.test.js'
      - 'tests/textual-variants-b07.test.js'
      - 'tests/matakin-2012-verified-glyphs.test.js'
      - 'tests/matakin-2012-lunyu-glyphs-batch-02.test.js'
      - 'tests/daxue-matakin-2012-supplement.test.js'
      - 'tests/zhongyong-matakin-2012-interpretation.test.js'
      - 'tests/daxue-qinmin-xinmin-variant.test.js'
      - 'tests/lunyu-14-39-matakin-variant.test.js'
      - 'tests/zhongyong-ix-pinyin-variant.test.js'
      - 'editor/tests/zhongyong-ix-pinyin-smoke.mjs'
      - 'editor/tests/lunyu-14-39-variant-smoke.mjs'
      - 'editor/tests/daxue-qinmin-smoke.mjs'
      - 'editor/tests/zhongyong-comparison-smoke.mjs'
      - 'editor/tests/daxue-section-smoke.mjs'
      - 'tests/mengzi-commentary-09-07.test.js'
      - 'tests/yun-hanzi-batch-01.test.js'
      - 'tests/yun-hanzi-batch-02.test.js'
      - 'tests/yun-hanzi-batch-03.test.js'
      - 'tests/zhu-xi-audit.test.js'
      - 'tests/matakin-2012-chapters.test.js'
      - 'docs/audits/**'
      - 'tools/import_legge_zhongyong.js'
      - 'sources/legge/**'
      - 'tools/dictionaries/**'
      - '.github/workflows/editorial-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild current scripture package
        run: python3 tools/build_sishu.py
      - name: Check text mapping and final status against current scripture
        run: node tools/audit_review_status.js
      - name: Validate editor JavaScript syntax
        run: node --check editor/app.js
      - name: Verify MATAKIN 2012 chapter mapping and editorial UI
        run: |
          node --test tests/matakin-2012-chapters.test.js
          node editor/tests/smoke.mjs
          node editor/tests/daxue-section-smoke.mjs
          node editor/tests/zhongyong-comparison-smoke.mjs
          node editor/tests/daxue-qinmin-smoke.mjs
          node editor/tests/lunyu-14-39-variant-smoke.mjs
          node editor/tests/zhongyong-ix-pinyin-smoke.mjs
      - name: Validate Legge importer JavaScript
        run: node --check tools/import_legge_zhongyong.js
      - name: Run editorial regression tests
        run: node --test tests/editorial-review.test.js tests/zhongyong-coverage.test.js tests/mengzi-coverage.test.js tests/mengzi-coverage-13-14.test.js tests/mengzi-coverage-04-12.test.js tests/mengzi-coverage-10-passages.test.js tests/mengzi-coverage-batch-03.test.js tests/mengzi-coverage-batch-04.test.js tests/lunyu-batch-05.test.js tests/lunyu-batch-06.test.js tests/textual-variants-b07.test.js tests/matakin-2012-verified-glyphs.test.js tests/matakin-2012-lunyu-glyphs-batch-02.test.js tests/daxue-matakin-2012-supplement.test.js tests/zhongyong-matakin-2012-interpretation.test.js tests/daxue-qinmin-xinmin-variant.test.js tests/lunyu-14-39-matakin-variant.test.js tests/zhongyong-ix-pinyin-variant.test.js tests/mengzi-commentary-09-07.test.js tests/yun-hanzi-batch-01.test.js tests/yun-hanzi-batch-02.test.js tests/yun-hanzi-batch-03.test.js tests/zhu-xi-audit.test.js
