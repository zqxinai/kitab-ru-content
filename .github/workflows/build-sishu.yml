name: Build Si Shu JSON package
on:
  push:
    branches: [main]
    paths:
      - 'sishu/**'
      - 'tools/build_sishu.py'
      - '.github/workflows/build-sishu.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kitab-ru-sishu-package
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Assemble and validate complete package
        run: python3 tools/build_sishu.py
      - name: Upload reproducible archive
        uses: actions/upload-artifact@v4
        with:
          name: sishu-content-draft
          path: |
            dist/sishu-content.json
            dist/sishu-content.sha256
            dist/build-report.json
          retention-days: 30
      - name: Publish versioned JSON to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/sishu-content.json dist/sishu-content.sha256 dist/build-report.json
          if git diff --cached --quiet; then
            echo "No change to dist."
          else
            git commit -m "build(sishu): regenerate complete JSON package [skip ci]"
            git push origin HEAD:main
          fi
