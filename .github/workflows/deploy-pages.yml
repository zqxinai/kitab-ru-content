name: Publish Kitab Ru Editor (GitHub Pages)
on:
  workflow_run:
    workflows: ["Build Si Shu JSON package"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'editor/**'
      - 'ru-classics/**'
      - 'tests/ru-classics-reading*.test.js'
      - 'tools/build_ru_classics_web.py'
      - 'audit/**'
      - 'index.html'
      - 'catalog.json'
      - 'dist/sishu-english-alignment.json'
      - 'dist/sishu-review-status.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  actions: read
  id-token: write

concurrency:
  group: kitab-ru-editor-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate editor and audit dashboard
        run: |
          node editor/tests/validate.mjs
          node editor/tests/smoke.mjs
          node audit/tests/regression.mjs
      - name: Validate and assemble Ru Classics website
        run: |
          node --check ru-classics/app.js
          node --check ru-classics/reading-normalization.js
          node --check ru-classics/editor.js
          node --check ru-classics/firebase-config.js
          node --test ru-classics/tests/auth-google.cjs
          python tools/build_ru_classics_web.py --source dist/sishu-content.json --alignment dist/sishu-english-alignment.json --splits dist/sishu-english-passage-splits.json --output ru-classics/data/sishu.json
          node ru-classics/tests/smoke.cjs
          node --test ru-classics/tests/subverses.cjs
          node --test ru-classics/tests/reading-navigation.cjs
          node --test tests/ru-classics-reading-normalization.test.js
          node --test tests/ru-classics-reading-corpus.test.js
          node --test tests/matakin-reference-overlay.test.cjs
      - name: Configure optional Google editor login
        env:
          RU_FIREBASE_CONFIG_JSON: ${{ vars.RU_FIREBASE_CONFIG_JSON }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          raw = os.environ.get('RU_FIREBASE_CONFIG_JSON', '').strip()
          if not raw:
              print('Firebase belum terhubung; pembaca tetap publik, login editor nonaktif.')
          else:
              cfg = json.loads(raw)
              if not isinstance(cfg, dict) or not all(isinstance(cfg.get(k), str) and cfg[k] for k in ('apiKey','authDomain','projectId','appId')):
                  raise ValueError('Firebase web config tidak lengkap')
              if cfg['projectId'] != 'ru-classics' or cfg['authDomain'] != 'ru-classics.firebaseapp.com':
                  raise ValueError('Firebase web config harus menggunakan proyek ru-classics')
              # Only public web-app config belongs in the downloadable site.
              if any(k not in ('apiKey','authDomain','projectId','appId','measurementId','storageBucket','messagingSenderId','databaseURL') for k in cfg):
                  raise ValueError('Tidak boleh menyertakan field Firebase yang tidak dikenal dalam config publik')
              Path('ru-classics/firebase-config.js').write_text(
                  'window.RU_FIREBASE_CONFIG = ' + json.dumps(cfg, ensure_ascii=False) + ';\n',
                  encoding='utf-8'
              )
              print('Google login config ditambahkan ke pembaca publik (bukan bukti login berhasil).')
          PY
      - name: Report Firebase Google editor readiness
        run: node tools/ru_firebase_readiness.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub sometimes exposes the uploaded Pages artifact a few seconds after upload.
      # Poll the actual run's artifact index to avoid "No artifacts named github-pages" errors.
      - name: Confirm Pages artifact is indexed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          for attempt in $(seq 1 15); do
            count=$(gh api "/repos/$GH_REPO/actions/runs/$GH_RUN_ID/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length') || count=0
            if [ "$count" -eq 1 ]; then
              echo "Exactly one Pages artifact indexed for run $GH_RUN_ID."
              exit 0
            fi
            if [ "$count" -gt 1 ]; then
              echo "::error::Multiple Pages artifacts indexed in the same run; refusing ambiguous deployment."
              exit 1
            fi
            echo "Pages artifact not indexed yet (attempt $attempt/15)."
            sleep 3
          done
          echo "::error::Pages artifact not indexed after bounded retries."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
