name: Publish Kitab Ru Editor (GitHub Pages)
on:
  workflow_run:
    workflows: ["Build Si Shu JSON package"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'editor/**'
      - 'ru-classics/**'
      - 'tools/build_ru_classics_web.py'
      - 'audit/**'
      - 'index.html'
      - 'catalog.json'
      - 'dist/sishu-english-alignment.json'
      - 'dist/sishu-review-status.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  actions: read
  id-token: write

concurrency:
  group: kitab-ru-editor-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate editor and audit dashboard
        run: |
          node editor/tests/validate.mjs
          node editor/tests/smoke.mjs
          node audit/tests/regression.mjs
      - name: Validate and assemble Ru Classics website
        run: |
          node --check ru-classics/app.js
          node --check ru-classics/editor.js
          python tools/build_ru_classics_web.py --source dist/sishu-content.json --alignment dist/sishu-english-alignment.json --splits dist/sishu-english-passage-splits.json --output ru-classics/data/sishu.json
          node ru-classics/tests/smoke.cjs
          node --test ru-classics/tests/subverses.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub sometimes exposes the uploaded Pages artifact a few seconds after upload.
      # Poll the actual run's artifact index to avoid "No artifacts named github-pages" errors.
      - name: Confirm Pages artifact is indexed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          for attempt in $(seq 1 15); do
            count=$(gh api "/repos/$GH_REPO/actions/runs/$GH_RUN_ID/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length') || count=0
            if [ "$count" -eq 1 ]; then
              echo "Exactly one Pages artifact indexed for run $GH_RUN_ID."
              exit 0
            fi
            if [ "$count" -gt 1 ]; then
              echo "::error::Multiple Pages artifacts indexed in the same run; refusing ambiguous deployment."
              exit 1
            fi
            echo "Pages artifact not indexed yet (attempt $attempt/15)."
            sleep 3
          done
          echo "::error::Pages artifact not indexed after bounded retries."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
