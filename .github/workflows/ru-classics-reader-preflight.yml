name: Ru Classics reader smoke preflight

on:
  pull_request:
    paths:
      - 'ru-classics/**'
      - 'tools/build_ru_classics_web.py'
      - '.github/workflows/ru-classics-reader-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scripts
        run: |
          node --check ru-classics/app.js
          node --check ru-classics/reading-normalization.js
          node --check ru-classics/editor.js
          node --check ru-classics/reference-overlay.js
          node --check ru-classics/same-book-references.js
          node --check ru-classics/book-references.js
          node --check ru-classics/firebase-config.js
          node --test ru-classics/tests/auth-google.cjs
      - name: Build reader package and test reference navigation
        run: |
          python tools/build_ru_classics_web.py --source dist/sishu-content.json --alignment dist/sishu-english-alignment.json --splits dist/sishu-english-passage-splits.json --output ru-classics/data/sishu.json
          python -m unittest tools.test_ru_unihan_glossary
          python tools/build_ru_unihan_glossary.py --bundle ru-classics/data/sishu.json --output ru-classics/data/character-unihan.json
          node --test ru-classics/tests/character-unihan.cjs
          node ru-classics/tests/smoke.cjs
          node --test ru-classics/tests/subverses.cjs
          node --test ru-classics/tests/reading-navigation.cjs
          node --test ru-classics/tests/same-book-references.cjs
          node --test ru-classics/tests/book-references.cjs
          node --test tests/ru-classics-reading-normalization.test.js
          node --test tests/matakin-reference-overlay.test.cjs
